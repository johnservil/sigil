# Every check QUALITY.md lists as run on each push. The kernel-checked known
# answers and certificates (lean/Sigil/KnownAnswers.lean,
# tools/test_certificate.py) run by hand.
name: CI
on: [push, pull_request]
jobs:
  # Every Python file runs under CPython and PyPy alike.
  python:
    strategy:
      matrix:
        python: ["3.12", "pypy3.10"]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - run: python alphabet/alphabet.py --check   # downloads Unicode 14.0.0's data, checked by SHA-256 and BLAKE3
    - run: python python/vectors.py --check
    - run: python python/test.py
  rust:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - run: cargo test --release
      working-directory: rust
  typescript-and-browser:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    # The TypeScript that reproduces the checked-in bundles exactly.
    - run: npx -y -p typescript@5.9.3 tsc -p typescript
    - run: node typescript/dist/test.js
    - run: python3 tools/build-web.py --check
    # tools/test-web.py runs `chromium`; the runner ships Chrome.
    - run: sudo ln -sf "$(command -v google-chrome)" /usr/local/bin/chromium && python3 tools/test-web.py
  lean:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: |
        curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
    # Every proof, and the specification on the vectors; the kernel-checked
    # known answers (Sigil.KnownAnswers) need more memory than the runner has,
    # and run by hand with the certificate tests.
    - run: lake build Sigil.Spec Sigil.Layout Sigil.Theorems Sigil.Errors Tests && lake exe tests ../vectors.tsv
      working-directory: lean
